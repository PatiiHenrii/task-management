spring.application.name=task-management

# PostgreSQL connection. Override these environment variables per environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskmanager}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema changes are managed by Flyway migrations.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Use a unique Base64-encoded key of at least 32 bytes outside local development.
security.jwt.secret=${JWT_SECRET:VGhpc0lzQUxvY2FsRGV2ZWxvcG1lbnRTZWNyZXRLZXlGb3JKV1Q=}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
