spring.application.name=task-management

# PostgreSQL connection. Override these environment variables per environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/task_management}
spring.datasource.username=${DB_USERNAME:task_management}
spring.datasource.password=${DB_PASSWORD:task_management}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema changes are managed by Flyway migrations.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
