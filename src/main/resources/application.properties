spring.application.name=task-management

# Comma-separated browser origins allowed to call the API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# PostgreSQL connection. Override these environment variables per environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskmanager}
spring.datasource.username=${DB_USER:${DB_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema changes are managed by Flyway migrations.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Use a unique Base64-encoded key of at least 32 bytes outside local development.
security.jwt.secret=${JWT_SECRET:VGhpc0lzQUxvY2FsRGV2ZWxvcG1lbnRTZWNyZXRLZXlGb3JKV1Q=}
security.jwt.expiration-ms=${JWT_EXPIRATION:${JWT_EXPIRATION_MS:3600000}}
